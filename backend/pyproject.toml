[project]
name = "hamdaz-backend"
version = "0.1.0"
description = "Hamdaz 2.0 ERP backend — FastAPI + Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert — used throughout the test suite
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Test names and fixtures are long by design; readability beats the column limit here.
"tests/*" = ["S105", "S106", "E501"]
# Migrations are generated from Alembic's template; restyling them adds churn to files
# that are never edited by hand. "alembic/**" so the glob reaches versions/ too.
"alembic/**" = ["E501", "N999", "UP035", "UP007", "I001"]

# ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastAPI/SQLAlchemy decorators are untyped
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "jose.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Postgres (skipped unless DATABASE_URL is set)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
